name: Workshop checks

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Run Workshop checks
        run: make check
